<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="auth-modal">
    <!-- AUTH MODAL (Login / Register) -->
    <div class="custom-modal-overlay" id="authModal" onclick="handleOverlayClick(event,'authModal')">
        <div class="custom-modal-box" style="max-width: 450px;">
            <div class="custom-modal-header border-0 pb-1">
                <ul class="nav nav-pills nav-fill w-100 bg-light rounded-pill p-1" id="authTabs" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button class="nav-link active rounded-pill fw-bold py-2" id="tabLoginBtn" type="button"
                            onclick="switchAuthTab('login')">
                            <i class="fas fa-sign-in-alt me-1"></i> Đăng Nhập
                        </button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link rounded-pill fw-bold py-2 text-secondary" id="tabRegisterBtn"
                            type="button" onclick="switchAuthTab('register')">
                            <i class="fas fa-user-plus me-1"></i> Đăng Ký
                        </button>
                    </li>
                </ul>
                <button class="modal-close-btn ms-2" onclick="closeModal('authModal')">&times;</button>
            </div>

            <div class="custom-modal-body pt-3 pb-4">
                <!-- FORM ĐĂNG NHẬP -->
                <form id="loginForm" onsubmit="handleLoginSubmit(event)">
                    <div class="text-center mb-3">
                        <h5 class="fw-bold text-dark mb-1">Chào Mừng Trở Lại! 👋</h5>
                        <p class="text-muted fs-7 mb-0">Đăng nhập để nhận tư vấn sách chuẩn gu và quản lý đơn hàng</p>
                    </div>

                    <div id="loginAlert" class="alert alert-danger py-2 fs-7 d-none" role="alert"></div>

                    <div class="mb-3">
                        <label class="form-label fs-7 fw-bold text-secondary mb-1">Email tài khoản</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 rounded-start-pill"><i
                                    class="fas fa-envelope text-muted"></i></span>
                            <input type="email" id="loginEmail"
                                class="form-control border-start-0 rounded-end-pill py-2 fs-7"
                                placeholder="name@example.com" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fs-7 fw-bold text-secondary mb-1">Mật khẩu</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 rounded-start-pill"><i
                                    class="fas fa-lock text-muted"></i></span>
                            <input type="password" id="loginPassword" class="form-control border-start-0 py-2 fs-7"
                                placeholder="Nhập mật khẩu" required>
                            <button type="button"
                                class="btn btn-light border border-start-0 rounded-end-pill text-muted px-3"
                                onclick="togglePasswordVisibility('loginPassword', this)">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <div class="d-flex justify-content-between align-items-center mb-3 fs-7">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="rememberMe" checked>
                            <label class="form-check-label text-muted" for="rememberMe">Ghi nhớ đăng nhập</label>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 rounded-pill py-2 fw-bold shadow-sm"
                        id="btnLoginSubmit">
                        <i class="fas fa-sign-in-alt me-1"></i> Đăng Nhập
                    </button>

                    <!-- Gợi ý tài khoản nhanh -->
                    <div class="mt-3 p-2 bg-light rounded-3 text-center fs-8 text-muted border">
                        <div class="fw-bold mb-1"><i class="fas fa-key text-warning me-1"></i>Tài khoản mẫu thử nghiệm:
                        </div>
                        <div class="d-flex justify-content-center gap-2">
                            <a href="javascript:void(0)"
                                class="badge bg-white text-primary border text-decoration-none py-1 px-2"
                                onclick="quickFillLogin('admin@bookmind.com','123456')">Admin (123456)</a>
                            <a href="javascript:void(0)"
                                class="badge bg-white text-secondary border text-decoration-none py-1 px-2"
                                onclick="quickFillLogin('khachhang1@gmail.com','123456')">Khách hàng (123456)</a>
                        </div>
                    </div>
                </form>

                <!-- FORM ĐĂNG KÝ -->
                <form id="registerForm" class="d-none" onsubmit="handleRegisterSubmit(event)">
                    <div class="text-center mb-3">
                        <h5 class="fw-bold text-dark mb-1">Tạo Tài Khoản Mới 🚀</h5>
                        <p class="text-muted fs-7 mb-0">Trở thành thành viên của BookMind AI ngay hôm nay</p>
                    </div>

                    <div id="registerAlert" class="alert alert-danger py-2 fs-7 d-none" role="alert"></div>

                    <div class="mb-2">
                        <label class="form-label fs-7 fw-bold text-secondary mb-1">Họ và tên</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 rounded-start-pill"><i
                                    class="fas fa-user text-muted"></i></span>
                            <input type="text" id="regFullName"
                                class="form-control border-start-0 rounded-end-pill py-2 fs-7"
                                placeholder="Nguyễn Văn A" required>
                        </div>
                    </div>

                    <div class="mb-2">
                        <label class="form-label fs-7 fw-bold text-secondary mb-1">Email</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 rounded-start-pill"><i
                                    class="fas fa-envelope text-muted"></i></span>
                            <input type="email" id="regEmail"
                                class="form-control border-start-0 rounded-end-pill py-2 fs-7"
                                placeholder="name@example.com" required>
                        </div>
                    </div>

                    <div class="mb-2">
                        <label class="form-label fs-7 fw-bold text-secondary mb-1">Số điện thoại</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 rounded-start-pill"><i
                                    class="fas fa-phone text-muted"></i></span>
                            <input type="tel" id="regPhone"
                                class="form-control border-start-0 rounded-end-pill py-2 fs-7" placeholder="0912345678">
                        </div>
                    </div>

                    <div class="mb-2">
                        <label class="form-label fs-7 fw-bold text-secondary mb-1">Mật khẩu</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 rounded-start-pill"><i
                                    class="fas fa-lock text-muted"></i></span>
                            <input type="password" id="regPassword" class="form-control border-start-0 py-2 fs-7"
                                placeholder="Ít nhất 6 ký tự" minlength="6" required>
                            <button type="button"
                                class="btn btn-light border border-start-0 rounded-end-pill text-muted px-3"
                                onclick="togglePasswordVisibility('regPassword', this)">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fs-7 fw-bold text-secondary mb-1">Xác nhận mật khẩu</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 rounded-start-pill"><i
                                    class="fas fa-shield-alt text-muted"></i></span>
                            <input type="password" id="regConfirmPassword" class="form-control border-start-0 py-2 fs-7"
                                placeholder="Nhập lại mật khẩu" required>
                            <button type="button"
                                class="btn btn-light border border-start-0 rounded-end-pill text-muted px-3"
                                onclick="togglePasswordVisibility('regConfirmPassword', this)">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-success w-100 rounded-pill py-2 fw-bold shadow-sm"
                        id="btnRegisterSubmit">
                        <i class="fas fa-user-plus me-1"></i> Đăng Ký Tài Khoản
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
