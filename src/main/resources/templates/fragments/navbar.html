<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-custom sticky-top">
    <div class="container">
        <a class="navbar-brand brand-logo" th:href="@{/}">
            <img th:src="@{/images/nhanam-logo-green.png}" alt="Nhã Nam Book Store" class="brand-logo-img">
            <div class="brand-text-container">
                <span class="brand-title">NHÃ NAM</span>
                <span class="brand-sub">BOOK STORE</span>
            </div>
        </a>

        <button class="navbar-toggler border-0" type="button" onclick="toggleNavbar()">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarMain">
            <!-- Thanh tìm kiếm -->
            <div class="mx-auto my-2 my-lg-0 search-box-wrapper" style="max-width: 320px; width: 100%;">
                <form th:action="@{/books}" method="get" class="input-group input-group-sm">
                    <span class="input-group-text bg-white border-end-0 rounded-start-pill ps-3 text-muted">
                        <i class="fas fa-search fs-8"></i>
                    </span>
                    <input type="text" name="keyword" id="searchInput"
                        class="form-control border-start-0 rounded-end-pill ps-0 py-1.5 fs-8"
                        placeholder="Tìm tên sách, tác giả..." autocomplete="off" th:value="${keyword}">
                </form>
                <div class="search-dropdown-panel" id="searchDropdownPanel"></div>
            </div>

            <ul class="navbar-nav ms-auto align-items-center gap-2 flex-row flex-wrap flex-lg-nowrap">
                <li class="nav-item">
                    <a class="nav-link fw-semibold fs-7 px-2 text-dark" th:href="@{/}">Trang Chủ</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link fw-semibold fs-7 px-2 text-dark" th:href="@{/books}">Kho Sách</a>
                </li>
                <li class="nav-item dropdown" th:if="${categories != null}">
                    <a class="nav-link dropdown-toggle fw-semibold fs-7 px-2 text-dark" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                        Danh Mục
                    </a>
                    <ul class="dropdown-menu shadow-sm border-0 rounded-3">
                        <li th:each="cat : ${categories}">
                            <a class="dropdown-item fs-8 py-2" th:href="@{/books(categoryId=${cat.id})}" th:text="${cat.name}">Danh mục</a>
                        </li>
                    </ul>
                </li>
                <li class="nav-item">
                    <a th:href="@{/cart}" class="btn btn-outline-primary btn-sm position-relative rounded-pill px-2.5 py-1.5 fw-bold fs-8" id="navCartBtn">
                        <i class="fas fa-shopping-bag me-1"></i> Giỏ Hàng
                        <span id="cartBadge" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" style="display: none;">0</span>
                    </a>
                </li>
                <!-- Auth Container -->
                <li class="nav-item d-flex align-items-center gap-2 ms-lg-2" id="navAuthContainer">
                    <button class="btn btn-outline-primary btn-sm rounded-pill px-3 py-1.5 fw-bold"
                        style="font-size: 0.82rem;" onclick="openAuthModal('login')">
                        <i class="fas fa-sign-in-alt me-1"></i> Đăng Nhập
                    </button>
                    <button class="btn btn-primary btn-sm rounded-pill px-3 py-1.5 fw-bold shadow-sm"
                        style="font-size: 0.82rem;" onclick="openAuthModal('register')">
                        <i class="fas fa-user-plus me-1"></i> Đăng Ký
                    </button>
                </li>
            </ul>
        </div>
    </div>
</nav>
</body>
</html>
