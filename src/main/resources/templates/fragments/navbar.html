<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<header th:fragment="navbar" class="sticky-top">
    <!-- 0. Top Announcement Ticker Bar -->
    <div class="top-ticker-bar d-none d-md-block">
        <div class="container d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center gap-3">
                <span class="badge-gold"><i class="fas fa-bolt me-1"></i>SIÊU ƯU ĐÃI</span>
                <span>Miễn phí vận chuyển toàn quốc cho đơn hàng từ 250.000đ • Giảm ngay 10% với mã <b>AI10</b></span>
            </div>
            <div class="d-flex align-items-center gap-3 fs-9">
                <span><i class="fas fa-headset me-1"></i>Hotline: <b>1900 6868</b></span>
                <span class="opacity-50">|</span>
                <a th:href="@{/my-orders}" class="text-white text-decoration-none hover-underline">
                    <i class="fas fa-truck-fast me-1"></i>Tra Cứu Đơn Hàng
                </a>
            </div>
        </div>
    </div>

    <!-- Main Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-custom">
        <div class="container">
            <!-- Brand Logo -->
            <a class="navbar-brand brand-logo" th:href="@{/}">
                <img th:src="@{/images/nhanam-logo-green.png}" alt="Nhã Nam Book Store" class="brand-logo-img">
                <div class="brand-text-container">
                    <span class="brand-title">NHÃ NAM</span>
                    <span class="brand-sub">BOOK STORE AI</span>
                </div>
            </a>

            <!-- Mobile Toggler -->
            <button class="navbar-toggler border-0 shadow-none p-2" type="button" onclick="toggleNavbar()" aria-label="Toggle navigation">
                <i class="fas fa-bars fs-5 text-dark"></i>
            </button>

            <!-- Navbar Collapsible Content -->
            <div class="collapse navbar-collapse" id="navbarMain">
                <!-- Search Bar -->
                <div class="mx-auto my-2 my-lg-0 search-box-wrapper" style="max-width: 380px; width: 100%;">
                    <form th:action="@{/books}" method="get" class="input-group input-group-sm">
                        <span class="input-group-text bg-white border-end-0 rounded-start-pill ps-3 text-muted">
                            <i class="fas fa-search fs-8 text-primary"></i>
                        </span>
                        <input type="text" name="keyword" id="searchInput"
                            class="form-control border-start-0 rounded-end-pill ps-1 py-2 fs-8 shadow-none"
                            placeholder="Tìm tựa sách, tác giả, thể loại..." autocomplete="off" th:value="${keyword}">
                    </form>
                    <div class="search-dropdown-panel" id="searchDropdownPanel"></div>
                </div>

                <!-- Nav Action Links -->
                <ul class="navbar-nav ms-auto align-items-center gap-2 flex-row flex-wrap flex-lg-nowrap">
                    <li class="nav-item">
                        <a class="nav-link fw-semibold fs-7 px-2.5 text-dark" th:href="@{/}">Trang Chủ</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link fw-semibold fs-7 px-2.5 text-dark" th:href="@{/books}">Kho Sách</a>
                    </li>

                    <!-- Categories Dropdown Menu -->
                    <li class="nav-item dropdown" th:if="${categories != null and not #lists.isEmpty(categories)}">
                        <a class="nav-link dropdown-toggle fw-semibold fs-7 px-2.5 text-dark" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="fas fa-layer-group text-primary me-1"></i> Danh Mục
                        </a>
                        <ul class="dropdown-menu shadow-lg border-0 rounded-4 p-2 mt-2" style="min-width: 230px;">
                            <li>
                                <a class="dropdown-item fw-bold text-primary fs-8 py-2 rounded-3" th:href="@{/books}">
                                    <i class="fas fa-book-open me-2"></i>Tất Cả Thể Loại
                                </a>
                            </li>
                            <li><hr class="dropdown-divider my-1"></li>
                            <li th:each="cat : ${categories}">
                                <a class="dropdown-item fs-8 py-2 rounded-3 text-dark d-flex align-items-center justify-content-between"
                                   th:href="@{/books(categoryId=${cat.id})}">
                                    <span th:text="${cat.name}">Tên thể loại</span>
                                    <i class="fas fa-chevron-right fs-9 text-muted opacity-50"></i>
                                </a>
                            </li>
                        </ul>
                    </li>

                    <!-- Cart Button with dynamic counter -->
                    <li class="nav-item">
                        <a th:href="@{/cart}" class="btn btn-outline-primary btn-sm position-relative rounded-pill px-3 py-1.5 fw-bold fs-8 d-inline-flex align-items-center gap-1.5 shadow-xs" id="navCartBtn">
                            <i class="fas fa-shopping-bag"></i>
                            <span>Giỏ Hàng</span>
                            <span id="cartBadge" class="badge rounded-pill bg-danger ms-1" style="display: none; font-size: 0.7rem;">0</span>
                        </a>
                    </li>

                    <!-- Auth Container (Login / Register / User Dropdown) -->
                    <li class="nav-item d-flex align-items-center gap-2 ms-lg-1" id="navAuthContainer">
                        <button class="btn btn-outline-primary btn-sm rounded-pill px-3 py-1.5 fw-bold fs-8" onclick="openAuthModal('login')">
                            <i class="fas fa-sign-in-alt me-1"></i> Đăng Nhập
                        </button>
                        <button class="btn btn-primary btn-sm rounded-pill px-3 py-1.5 fw-bold fs-8 shadow-sm" onclick="openAuthModal('register')">
                            <i class="fas fa-user-plus me-1"></i> Đăng Ký
                        </button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
</header>
</body>
</html>
