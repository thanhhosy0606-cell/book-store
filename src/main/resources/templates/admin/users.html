<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">Quản Lý Khách Hàng - Nhã Nam Book Store</title>
    <link rel="icon" type="image/png" th:href="@{/images/nhanam-logo-green.png}">

    <!-- Bootstrap 5 CSS -->
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
    <!-- Font Awesome 6 -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <!-- Admin CSS -->
    <link th:href="@{/css/admin.css?v=3.0}" rel="stylesheet">
</head>

<body class="admin-body">

    <!-- SIDEBAR -->
    <aside th:replace="~{admin/sidebar :: sidebar(${activeTab})}"></aside>

    <!-- MAIN CONTENT -->
    <main class="admin-main">
        <!-- TOPBAR -->
        <header class="admin-topbar">
            <div class="topbar-left">
                <h1 class="topbar-page-title">Quản Lý Thành Viên & Khách Hàng</h1>
            </div>

            <div class="topbar-right">
                <div class="admin-user-profile">
                    <img th:src="@{/images/book_ai.png}" alt="Admin Avatar">
                    <div class="admin-user-info">
                        <div id="adminNameDisplay" class="admin-user-name">Admin Nhã Nam</div>
                        <div id="adminRoleDisplay" class="admin-user-role">Quản Trị Viên</div>
                    </div>
                </div>

                <button class="btn-admin-logout" onclick="handleAdminLogout()" title="Đăng xuất">
                    <i class="fas fa-sign-out-alt"></i>
                </button>
            </div>
        </header>

        <!-- CONTENT BODY -->
        <div class="admin-content">
            <div class="admin-card">
                <div class="admin-card-header">
                    <h2 class="admin-card-title">
                        <i class="fas fa-users text-primary"></i> Danh Sách Tài Khoản Khách Hàng
                        <span class="badge bg-primary ms-2" style="font-size: 0.8rem; border-radius: 20px; vertical-align: middle;"
                              th:text="${#lists.size(users)} + ' thành viên'">0 thành viên</span>
                    </h2>

                    <div class="admin-toolbar">
                        <input type="text" id="userSearchInput" class="admin-search-input" placeholder="Tìm tên, email, SĐT..." oninput="loadUsers()">
                        <select id="userStatusFilter" class="admin-filter-select" onchange="loadUsers()">
                            <option value="">Tất cả trạng thái</option>
                            <option value="ACTIVE">Hoạt động</option>
                            <option value="INACTIVE">Đã khóa</option>
                        </select>
                    </div>
                </div>

                <div class="admin-table-responsive">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>Avatar</th>
                                <th>Họ Và Tên</th>
                                <th>Email</th>
                                <th>Số Điện Thoại</th>
                                <th>Vai Trò</th>
                                <th>Trạng Thái</th>
                                <th style="width: 150px;">Thao Tác</th>
                            </tr>
                        </thead>
                        <tbody id="usersTableBody">
                            <tr>
                                <td colspan="7" class="text-center py-4 text-muted">Đang tải danh sách thành viên...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <!-- Scripts -->
    <script th:src="@{/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/js/admin.js?v=5.0}"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (typeof loadUsers === 'function') {
                loadUsers();
            }
        });
    </script>

</body>
</html>
