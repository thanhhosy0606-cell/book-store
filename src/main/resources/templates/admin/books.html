<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">Quản Lý Sách - Nhã Nam Book Store</title>
    <link rel="icon" type="image/png" th:href="@{/images/nhanam-logo-green.png}">

    <!-- Bootstrap 5 CSS -->
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
    <!-- Font Awesome 6 -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <!-- Admin CSS -->
    <link th:href="@{/css/admin.css?v=3.0}" rel="stylesheet">
</head>

<body class="admin-body">

    <!-- SIDEBAR -->
    <aside th:replace="~{admin/sidebar :: sidebar(${activeTab})}"></aside>

    <!-- MAIN CONTENT -->
    <main class="admin-main">
        <!-- TOPBAR -->
        <header class="admin-topbar">
            <div class="topbar-left">
                <h1 class="topbar-page-title">Quản Lý Kho Sách</h1>
            </div>

            <div class="topbar-right">
                <div class="admin-user-profile">
                    <img th:src="@{/images/book_ai.png}" alt="Admin Avatar">
                    <div class="admin-user-info">
                        <div id="adminNameDisplay" class="admin-user-name">Admin Nhã Nam</div>
                        <div id="adminRoleDisplay" class="admin-user-role">Quản Trị Viên</div>
                    </div>
                </div>

                <button class="btn-admin-logout" onclick="handleAdminLogout()" title="Đăng xuất">
                    <i class="fas fa-sign-out-alt"></i>
                </button>
            </div>
        </header>

        <!-- CONTENT BODY -->
        <div class="admin-content">
            <div class="admin-card">
                <div class="admin-card-header">
                    <h2 class="admin-card-title">
                        <i class="fas fa-book text-primary"></i> Danh Sách Kho Sách
                        <span id="adminBooksCountBadge" class="badge bg-primary ms-2"
                            style="font-size: 0.8rem; border-radius: 20px; vertical-align: middle;"
                            th:text="${#lists.size(books)} + ' cuốn'">0 cuốn</span>
                    </h2>

                    <div class="admin-toolbar">
                        <input type="text" id="bookSearchInput" class="admin-search-input"
                            placeholder="Tìm tên sách, tác giả, ISBN..." oninput="onBookSearchInput()">
                        <select id="bookCategoryFilter" class="admin-filter-select" onchange="loadBooks()">
                            <option value="">Tất cả thể loại</option>
                            <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}">Thể loại</option>
                        </select>
                        <select id="bookStatusFilter" class="admin-filter-select" onchange="loadBooks()">
                            <option value="">Tất cả trạng thái</option>
                            <option value="AVAILABLE">Đang bán</option>
                            <option value="OUT_OF_STOCK">Hết hàng</option>
                            <option value="STOPPED">Ngưng kinh doanh</option>
                        </select>
                        <button class="btn-admin-primary" onclick="openBookAddModal()">
                            <i class="fas fa-plus"></i> Thêm Sách Mới
                        </button>
                    </div>
                </div>

                <div class="admin-table-responsive">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>Ảnh</th>
                                <th>Tên Sách</th>
                                <th>Tác Giả</th>
                                <th>Thể Loại</th>
                                <th>Giá Bán</th>
                                <th>Tồn Kho</th>
                                <th>Trạng Thái</th>
                                <th>Thao Tác</th>
                            </tr>
                        </thead>
                        <tbody id="booksTableBody">
                            <tr>
                                <td colspan="8" class="text-center py-4 text-muted">Đang tải danh sách sách...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <div class="d-flex justify-content-between align-items-center p-3 border-top bg-light" id="booksPagination">
                    <div class="text-muted fs-8" id="booksShowingText">Đang tải danh sách...</div>
                    <div class="d-flex gap-1 align-items-center" id="booksPageControls"></div>
                </div>
            </div>
        </div>
    </main>

    <!-- BOOK ADD / EDIT MODAL -->
    <div id="bookModal" class="admin-modal-overlay">
        <div class="admin-modal-box">
            <div class="admin-modal-header">
                <h3 id="bookModalTitle" class="admin-modal-title">Thêm Sách Mới</h3>
                <button class="admin-modal-close" onclick="closeAdminModal('bookModal')">&times;</button>
            </div>
            <form id="bookForm" onsubmit="handleSaveBook(event)">
                <div class="admin-modal-body">
                    <input type="hidden" id="bookIdInput">

                    <div class="form-group-admin">
                        <label class="form-label-admin">Tiêu Đề Sách *</label>
                        <input type="text" id="bookTitleInput" class="form-control-admin" required placeholder="Nhập tên cuốn sách...">
                    </div>

                    <div class="form-row-2">
                        <div class="form-group-admin">
                            <label class="form-label-admin">Tác Giả *</label>
                            <input type="text" id="bookAuthorInput" class="form-control-admin" required placeholder="Tên tác giả...">
                        </div>
                        <div class="form-group-admin">
                            <label class="form-label-admin">Thể Loại Sách *</label>
                            <select id="bookCategorySelect" class="form-control-admin" required>
                                <option value="">-- Chọn thể loại --</option>
                                <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}">Thể loại</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row-2">
                        <div class="form-group-admin">
                            <label class="form-label-admin">Nhà Xuất Bản</label>
                            <input type="text" id="bookPublisherInput" class="form-control-admin" placeholder="NXB Trẻ, Kim Đồng, Nhã Nam...">
                        </div>
                        <div class="form-group-admin">
                            <label class="form-label-admin">Mã ISBN</label>
                            <input type="text" id="bookIsbnInput" class="form-control-admin" placeholder="978-604-...">
                        </div>
                    </div>

                    <div class="form-row-2">
                        <div class="form-group-admin">
                            <label class="form-label-admin">Năm Xuất Bản</label>
                            <input type="number" id="bookYearInput" class="form-control-admin" placeholder="2024">
                        </div>
                        <div class="form-group-admin">
                            <label class="form-label-admin">Số Trang</label>
                            <input type="number" id="bookPagesInput" class="form-control-admin" placeholder="350">
                        </div>
                    </div>

                    <div class="form-row-2">
                        <div class="form-group-admin">
                            <label class="form-label-admin">Giá Gốc (VNĐ)</label>
                            <input type="number" id="bookOriginalPriceInput" class="form-control-admin" placeholder="200000">
                        </div>
                        <div class="form-group-admin">
                            <label class="form-label-admin">Giá Bán Thực Tế (VNĐ) *</label>
                            <input type="number" id="bookSalePriceInput" class="form-control-admin" required placeholder="150000">
                        </div>
                    </div>

                    <div class="form-row-2">
                        <div class="form-group-admin">
                            <label class="form-label-admin">Số Lượng Tồn Kho *</label>
                            <input type="number" id="bookStockInput" class="form-control-admin" required placeholder="50">
                        </div>
                        <div class="form-group-admin">
                            <label class="form-label-admin">Trạng Thái Kinh Doanh</label>
                            <select id="bookStatusInput" class="form-control-admin">
                                <option value="AVAILABLE">Đang kinh doanh (Có hàng)</option>
                                <option value="OUT_OF_STOCK">Tạm hết hàng</option>
                                <option value="STOPPED">Ngưng kinh doanh</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group-admin">
                        <label class="form-label-admin">Đường Dẫn Ảnh Bìa (URL hoặc đường dẫn nội bộ)</label>
                        <input type="text" id="bookImageInput" class="form-control-admin" placeholder="images/book_ai.png hoặc https://...">
                    </div>

                    <div class="form-group-admin">
                        <label class="form-label-admin">Mô Tả / Tóm Tắt Cuốn Sách</label>
                        <textarea id="bookDescInput" class="form-control-admin" rows="4" placeholder="Mô tả nội dung nổi bật của cuốn sách..."></textarea>
                    </div>
                </div>

                <div class="admin-modal-footer">
                    <button type="button" class="btn-admin-secondary" onclick="closeAdminModal('bookModal')">Hủy</button>
                    <button type="submit" class="btn-admin-primary"><i class="fas fa-save me-1"></i> Lưu Thông Tin Sách</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script th:src="@{/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/js/admin.js?v=27.0}"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (typeof loadBooks === 'function') {
                loadBooks();
            }
        });
    </script>

</body>
</html>
