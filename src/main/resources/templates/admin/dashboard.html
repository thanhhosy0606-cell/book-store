<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">Tổng Quan Quản Trị - Nhã Nam Book Store</title>
    <link rel="icon" type="image/png" th:href="@{/images/nhanam-logo-green.png}">

    <!-- Bootstrap 5 CSS -->
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
    <!-- Font Awesome 6 -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Admin CSS -->
    <link th:href="@{/css/admin.css?v=3.0}" rel="stylesheet">
</head>

<body class="admin-body">

    <!-- SIDEBAR -->
    <aside th:replace="~{admin/sidebar :: sidebar(${activeTab})}"></aside>

    <!-- MAIN CONTENT -->
    <main class="admin-main">
        <!-- TOPBAR -->
        <header class="admin-topbar">
            <div class="topbar-left">
                <h1 class="topbar-page-title">Tổng Quan Doanh Thu & Hệ Thống</h1>
            </div>

            <div class="topbar-right">
                <div class="admin-user-profile">
                    <img th:src="@{/images/book_ai.png}" alt="Admin Avatar">
                    <div class="admin-user-info">
                        <div id="adminNameDisplay" class="admin-user-name">Admin Nhã Nam</div>
                        <div id="adminRoleDisplay" class="admin-user-role">Quản Trị Viên</div>
                    </div>
                </div>

                <button class="btn-admin-logout" onclick="handleAdminLogout()" title="Đăng xuất">
                    <i class="fas fa-sign-out-alt"></i>
                </button>
            </div>
        </header>

        <!-- CONTENT BODY -->
        <div class="admin-content">
            <!-- KPI GRID (Rendered dynamically by Thymeleaf SSR + Live JS) -->
            <div class="kpi-grid mb-4">
                <div class="kpi-card">
                    <div>
                        <div class="kpi-info-title">Sách Trong Kho</div>
                        <div class="kpi-info-value" th:text="${totalBooks}">0</div>
                        <div class="kpi-info-sub text-success">
                            <i class="fas fa-book-open"></i> Đang kinh doanh
                        </div>
                    </div>
                    <div class="kpi-icon-badge books">
                        <i class="fas fa-book-open"></i>
                    </div>
                </div>

                <div class="kpi-card">
                    <div>
                        <div class="kpi-info-title">Tổng Đơn Hàng</div>
                        <div class="kpi-info-value" th:text="${totalOrders}">0</div>
                        <div class="kpi-info-sub text-primary">
                            <i class="fas fa-shopping-cart"></i> Đơn mua toàn hệ thống
                        </div>
                    </div>
                    <div class="kpi-icon-badge orders">
                        <i class="fas fa-shopping-cart"></i>
                    </div>
                </div>

                <div class="kpi-card">
                    <div>
                        <div class="kpi-info-title">Khách Hàng Đăng Ký</div>
                        <div class="kpi-info-value" th:text="${totalUsers}">0</div>
                        <div class="kpi-info-sub text-success">
                            <i class="fas fa-user-check"></i> Thành viên tài khoản
                        </div>
                    </div>
                    <div class="kpi-icon-badge customers">
                        <i class="fas fa-user-friends"></i>
                    </div>
                </div>

                <div class="kpi-card">
                    <div>
                        <div class="kpi-info-title">Thể Loại Sách</div>
                        <div class="kpi-info-value" th:text="${totalCategories}">0</div>
                        <div class="kpi-info-sub text-info">
                            <i class="fas fa-tags"></i> Danh mục xuất bản
                        </div>
                    </div>
                    <div class="kpi-icon-badge revenue">
                        <i class="fas fa-layer-group"></i>
                    </div>
                </div>
            </div>

            <!-- REVENUE CHART & STATISTICS SECTION -->
            <div class="admin-card revenue-analytics-card mb-4">
                <div class="admin-card-header flex-wrap gap-3">
                    <div>
                        <h2 class="admin-card-title d-flex align-items-center gap-2">
                            <i class="fas fa-chart-line text-primary"></i> Biểu Đồ Doanh Thu & Thống Kê
                        </h2>
                        <p class="text-muted fs-8 mb-0" id="revenueChartSubtitle">
                            <i class="far fa-calendar-alt me-1"></i> Đang tải dữ liệu biểu đồ...
                        </p>
                    </div>

                    <!-- CONTROLS & FILTERS -->
                    <div class="d-flex align-items-center flex-wrap gap-2">
                        <div class="btn-group btn-group-sm period-btn-group" role="group">
                            <button type="button" class="btn btn-outline-primary active" id="btnPeriodDay" onclick="setRevenuePeriod('DAY')">
                                <i class="fas fa-calendar-day me-1"></i> Theo Ngày
                            </button>
                            <button type="button" class="btn btn-outline-primary" id="btnPeriodMonth" onclick="setRevenuePeriod('MONTH')">
                                <i class="fas fa-calendar-alt me-1"></i> Theo Tháng
                            </button>
                            <button type="button" class="btn btn-outline-primary" id="btnPeriodYear" onclick="setRevenuePeriod('YEAR')">
                                <i class="fas fa-calendar me-1"></i> Theo Năm
                            </button>
                        </div>

                        <select id="revenueFilterSelect" class="form-select form-select-sm" style="width: auto; min-width: 140px; font-weight: 600;" onchange="onRevenueFilterChange()">
                            <option value="7">7 ngày qua</option>
                            <option value="14">14 ngày qua</option>
                            <option value="30" selected>30 ngày qua</option>
                            <option value="60">60 ngày qua</option>
                        </select>
                    </div>
                </div>

                <div class="card-body p-3">
                    <div class="chart-container" style="position: relative; height: 320px;">
                        <canvas id="revenueAnalyticsChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Scripts -->
    <script th:src="@{/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/js/admin.js?v=22.0}"></script>

</body>
</html>
